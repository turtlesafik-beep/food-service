<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f4f5f7;
            color: #20242c;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            max-width: 520px;
            background: white;
            border-radius: 14px;
            padding: 42px 32px;
            box-shadow: 0 12px 36px rgba(24, 30, 40, 0.08);
        }

        .brand {
            color: #315fce;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            color: #777;
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">Food Service</div>
        <h1>Меню скоро появится</h1>
        <p>Сайт для выбора блюд и формирования списка заказа уже готовится.</p>
    </main>
</body>
</html>
