# Production Nginx, этап B: HTTPS после получения сертификатов Let's Encrypt.
#
# НЕ активируйте этот файл до появления сертификатов:
# Nginx не должен пытаться загрузить отсутствующие файлы.
#
# После выпуска сертификатов (файлы должны существовать внутри контейнера):
#   /etc/letsencrypt/live/sdahub.ru/fullchain.pem
#   /etc/letsencrypt/live/sdahub.ru/privkey.pem
#
# Включение без изменения Docker Compose:
#   cp nginx/default.https.conf nginx/default.conf
#   docker exec food-service-nginx nginx -t
#   docker exec food-service-nginx nginx -s reload
#
# В compose.production.yaml внешний каталог VPS /etc/letsencrypt уже смонтирован
# в /etc/letsencrypt:ro, поэтому после certbot сертификаты будут доступны.

# HTTP: только ACME challenge и редирект на HTTPS.
server {
    listen 80;
    server_name sdahub.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /admin {
        return 301 https://sdahub.ru/admin/;
    }

    location / {
        return 301 https://sdahub.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sdahub.ru;

    ssl_certificate /etc/letsencrypt/live/sdahub.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sdahub.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    location / {
        try_files $uri $uri/ =404;
    }

    # Админ-панель: /admin/ -> web/admin/index.html.
    location = /admin {
        return 301 /admin/;
    }

    location = /admin/ {
        try_files /admin/index.html =404;
    }

    location /admin/ {
        # CSS, JS и другие файлы админки по относительным путям.
        try_files $uri $uri/ =404;
    }

    # Красивые ссылки на заказ: /order/{token} отдаёт статическую страницу.
    location /order/ {
        try_files $uri /order.html;
    }

    # ZIP-архив с фотографиями может быть значительно больше обычного
    # лимита 6 МБ. Принимаем тело потоком, чтобы nginx не сохранял его
    # во временный файл.
    location = /api/admin/restores/validate {
        proxy_pass http://app:3000;
        client_max_body_size 512m;
        client_body_timeout 600s;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Применение восстановления может занимать больше стандартных 60 секунд.
    location /api/admin/restores/ {
        proxy_pass http://app:3000;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Точный маршрут без завершающего слеша: иначе nginx отвечает 301.
    location = /api/admin/backups {
        proxy_pass http://app:3000;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Скачивание архива не должно буферизоваться nginx на диск.
    location /api/admin/backups/ {
        proxy_pass http://app:3000;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://app:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://app:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
