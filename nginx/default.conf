# Production Nginx, этап A: HTTP до получения сертификатов.
# После выпуска сертификатов замените этот файл на nginx/default.https.conf.
server {
    listen 80;
    server_name sdahub.ru;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    # Let's Encrypt HTTP-01 challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Красивые ссылки на заказ: /order/{token} отдаёт статическую страницу.
    location /order/ {
        try_files $uri /order.html;
    }

    location /api/ {
        proxy_pass http://app:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://app:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTTPS подключается после выпуска сертификата через nginx/default.https.conf.
    # Сейчас SSL намеренно не включён.
}
