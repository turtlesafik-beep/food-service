services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food-service-app
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: food-service-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - app

